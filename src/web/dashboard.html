<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hunt-Job • Dashboard</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap');

    :root {
      --bg: #0a0b0f;
      --surface: #111318;
      --surface-2: #171a21;
      --surface-3: #1f232c;
      --border: #272b35;
      --text: #f1f5f9;
      --muted: #8b92a3;
      --accent: #6366f1;
      --accent-2: #22d3ee;
      --green: #22c55e;
      --amber: #eab308;
      --red: #f43f5e;
      --radius: 14px;
      --shadow: 0 10px 15px -3px rgb(0 0 0 / 0.2), 0 4px 6px -4px rgb(0 0 0 / 0.2);
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system_ui, -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* Top bar */
    .topbar {
      position: sticky; top: 0; z-index: 50;
      background: rgba(17, 19, 24, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .brand {
      display: flex; align-items: center; gap: 10px; font-weight: 700;
      font-family: 'Space Grotesk', Inter, sans-serif; font-size: 18px; letter-spacing: -.02em;
    }
    .brand span { color: var(--accent); }
    .topbar-actions { display: flex; gap: 8px; align-items: center; }
    .btn {
      background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
      padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: all .15s cubic-bezier(0.4, 0, 0.2, 1);
      display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
    }
    .btn:hover { background: var(--surface-3); transform: translateY(-1px); border-color: #3b4150; }
    .btn-primary {
      background: var(--accent); color: white; border-color: var(--accent);
    }
    .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }

    /* Layout */
    .app-shell { display: flex; min-height: calc(100vh - 56px); }
    .sidebar {
      width: 220px; flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 16px 12px; display: flex; flex-direction: column;
    }
    .sidebar-nav { display: flex; flex-direction: column; gap: 2px; }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; border-radius: 10px; color: var(--muted);
      text-decoration: none; font-weight: 500; font-size: 13.5px;
      transition: all .12s ease; cursor: pointer;
    }
    .nav-item:hover { color: var(--text); background: var(--surface-2); }
    .nav-item.active { background: var(--surface-3); color: var(--text); border-left: 3px solid var(--accent); padding-left: 11px; }
    .nav-item svg { width: 18px; height: 18px; opacity: .85; }

    .main {
      flex: 1; min-width: 0; padding: 24px 28px; overflow-y: auto;
    }

    /* Stats row */
    .stats {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 12px;
      margin-bottom: 24px;
    }
    .stat {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 14px 18px; display: flex; flex-direction: column; gap: 2px;
      transition: transform .2s cubic-bezier(0.4,0,0.2,1), box-shadow .2s;
    }
    .stat:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
    .stat .label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
    .stat .value {
      font-size: 28px; font-weight: 700; letter-spacing: -0.025em; line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .stat.green .value { color: var(--green); }
    .stat.amber .value { color: var(--amber); }
    .stat.red .value { color: var(--red); }

    /* Views & sections */
    .view { display: none; }
    .view.active { display: block; animation: fadeUp 0.35s cubic-bezier(0.4, 0, 0.2, 1); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pop {
      from { transform: scale(0.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      transition: transform .18s cubic-bezier(0.4,0,0.2,1), box-shadow .18s, border-color .15s;
    }
    .card:hover { transform: translateY(-3px); box-shadow: var(--shadow); border-color: #343a48; }

    /* Pipeline board */
    .board {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px;
    }
    .column {
      background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius);
      display: flex; flex-direction: column; min-height: 420px;
    }
    .column-header {
      padding: 12px 14px; font-weight: 600; font-size: 13px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .column-count {
      font-size: 11px; padding: 1px 8px; background: var(--surface-3); border-radius: 999px; color: var(--muted);
    }
    .column-cards {
      padding: 10px; flex: 1; display: flex; flex-direction: column; gap: 8px;
      min-height: 80px; transition: background .1s ease;
    }
    .column-cards.drag-over { background: #1c2029; outline: 2px dashed #6366f140; outline-offset: -4px; }

    .kanban-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 12px 14px; cursor: grab; position: relative;
      transition: all .2s cubic-bezier(0.4, 0, 0.2, 1);
      font-size: 13.2px;
    }
    .kanban-card:hover { border-color: #454c5e; box-shadow: 0 4px 12px -2px rgb(0 0 0 / .15); }
    .kanban-card:active { cursor: grabbing; transform: scale(0.985); }
    .kanban-card.dragging { opacity: .5; box-shadow: none; }
    .kanban-card .company-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .kanban-card .avatar {
      width: 22px; height: 22px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), #a5b4fc);
      color: #111; font-weight: 700; font-size: 10px; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .kanban-card h4 { font-size: 13.6px; font-weight: 600; line-height: 1.3; margin-bottom: 3px; }
    .kanban-card .meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .kanban-card .loc { color: var(--muted); font-size: 12px; }

    /* Pills & badges */
    .pill {
      display: inline-flex; align-items: center; font-size: 11px; padding: 1px 9px; border-radius: 999px;
      font-weight: 600; letter-spacing: .015em; border: 1px solid transparent;
    }
    .pill.g { background: #052e16; color: var(--green); border-color: #166534; }
    .pill.a { background: #3f2a00; color: var(--amber); border-color: #854d0e; }
    .pill.r { background: #3b0f1c; color: var(--red); border-color: #881337; }
    .pill.b { background: rgba(99,102,241,.12); color: #a5b4fc; border-color: rgba(99,102,241,.3); }
    .pill.fresh { color: var(--amber); border-color: #854d0e; background: #3f2a00; font-size: 10px; }
    .pill.outline { background: transparent; color: var(--muted); border-color: var(--border); }

    /* Filters */
    .filters {
      display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; align-items: center;
    }
    .filter-chip {
      background: var(--surface-2); border: 1px solid var(--border); padding: 5px 13px; border-radius: 999px;
      font-size: 12.5px; cursor: pointer; transition: all .1s ease; user-select: none;
    }
    .filter-chip.active, .filter-chip:hover { background: var(--accent); color: white; border-color: var(--accent); }
    input[type="text"], select {
      background: var(--surface); color: var(--text); border: 1px solid var(--border);
      padding: 8px 12px; border-radius: 10px; font-size: 13.5px; outline: none;
      transition: border .15s;
    }
    input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,.1); }

    /* Tables */
    .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left; padding: 12px 16px; font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .06em; color: var(--muted); background: var(--surface-2); border-bottom: 1px solid var(--border);
    }
    td { padding: 14px 16px; border-bottom: 1px solid var(--border); font-size: 13.5px; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface-2); }

    /* Eval cards */
    .eval-card {
      border: 1px solid var(--border); background: var(--surface); border-radius: var(--radius);
      margin-bottom: 12px; overflow: hidden;
    }
    .eval-summary {
      padding: 16px 18px; display: flex; align-items: center; justify-content: space-between; cursor: pointer;
      gap: 12px;
    }
    .eval-summary:hover { background: var(--surface-2); }
    .eval-details { padding: 0 18px 18px; border-top: 1px solid var(--border); display: none; background: var(--surface-2); }
    .eval-card.open .eval-details { display: block; animation: fadeUp .2s ease; }
    .score-bar { height: 5px; background: var(--border); border-radius: 999px; overflow: hidden; margin-top: 4px; }
    .score-fill { height: 100%; background: var(--accent); transition: width .6s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .dim-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 12px 16px; margin-top: 14px; }
    .dim-item { font-size: 12.4px; }
    .dim-item .label-row { display:flex; justify-content:space-between; color:var(--muted); margin-bottom:3px; font-size:12px; }
    .chips { display:flex; flex-wrap:wrap; gap:6px; margin: 10px 0; }

    /* Modal / Drawer */
    .modal {
      position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center;
      background: rgba(0,0,0,.75); padding: 20px;
    }
    .modal.active { display: flex; animation: fadeUp .2s ease; }
    .modal-content {
      background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
      width: 100%; max-width: 620px; max-height: 88vh; overflow: auto; box-shadow: var(--shadow);
      animation: pop .22s cubic-bezier(0.34,1.56,.64,1);
    }
    .modal-header { padding: 20px 24px 12px; border-bottom: 1px solid var(--border); display:flex; justify-content:space-between; align-items:flex-start; }
    .modal-body { padding: 20px 24px; }
    .close-btn { background:none; border:none; color:var(--muted); font-size:22px; cursor:pointer; line-height:1; }
    .action-row { display:flex; gap:8px; flex-wrap:wrap; margin-top: 18px; }

    /* Profile */
    .profile { background: var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:26px; max-width:560px; }
    .profile h2 { font-size:22px; margin-bottom:2px; }
    .profile .role { color:var(--muted); }

    /* Toast */
    #toast {
      position: fixed; bottom: 24px; right: 24px; z-index: 200;
      background: var(--surface-3); border:1px solid var(--border); padding: 12px 18px;
      border-radius: 999px; box-shadow: var(--shadow); font-weight: 500; font-size: 13.5px;
      transform: translateY(20px); opacity: 0; transition: all .3s cubic-bezier(0.4,0,0.2,1);
      pointer-events: none;
    }
    #toast.show { transform: translateY(0); opacity: 1; pointer-events: auto; }
    #toast.success { border-left: 3px solid var(--green); }
    #toast.error { border-left: 3px solid var(--red); }

    .text-muted { color: var(--muted); }
    .section-title { font-size: 15px; font-weight: 600; margin: 18px 0 12px; letter-spacing: -.01em; display:flex; align-items:center; gap:8px; }

    .empty { color: var(--muted); font-size:13px; padding: 32px 12px; text-align:center; border: 1px dashed var(--border); border-radius: var(--radius); }
  </style>
</head>
<body>
<div id="toast"></div>

<!-- Top Bar -->
<header class="topbar">
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M7 12h10"/></svg>
    hunt<span>-job</span>
  </div>
  <div class="topbar-actions">
    <button onclick="refreshAll()" class="btn">↻ Refresh</button>
    <a href="#" onclick="showHint();return false" class="btn">CLI commands</a>
    <button onclick="window.location.reload()" class="btn-primary">Open in terminal → npm run dashboard</button>
  </div>
</header>

<div class="app-shell">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-nav">
      <a class="nav-item active" data-view="pipeline" onclick="switchView('pipeline', this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
        Pipeline
      </a>
      <a class="nav-item" data-view="jobs" onclick="switchView('jobs', this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3" y2="6"/><line x1="3" y1="12" x2="3" y2="12"/><line x1="3" y1="18" x2="3" y2="18"/></svg>
        Jobs
      </a>
      <a class="nav-item" data-view="evaluations" onclick="switchView('evaluations', this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        Evaluations
      </a>
      <a class="nav-item" data-view="profile" onclick="switchView('profile', this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Profile
      </a>
    </div>
    <div style="margin-top:auto; padding: 12px; font-size:12px; color:var(--muted); line-height:1.4;">
      Local only • SQLite<br>
      <span style="font-size:10.5px">Run: <code style="font-size:10px">npm run dashboard</code></span>
    </div>
  </aside>

  <main class="main">
    <!-- Stats -->
    <div class="stats" id="stats-row">
      <div class="stat"><div class="label">Scanned</div><div class="value" id="stat-scanned">0</div></div>
      <div class="stat"><div class="label">Evaluated</div><div class="value" id="stat-evaluated">0</div></div>
      <div class="stat green"><div class="label">Applied</div><div class="value" id="stat-applied">0</div></div>
      <div class="stat green"><div class="label">Offers</div><div class="value" id="stat-offers">0</div></div>
    </div>

    <!-- Pipeline -->
    <section id="view-pipeline" class="view active">
      <div class="section-title">Application Pipeline <span style="font-size:11px;opacity:.6;margin-left:6px;">Drag cards to change status</span></div>
      <div class="board" id="kanban-board"></div>
    </section>

    <!-- Jobs -->
    <section id="view-jobs" class="view">
      <div class="section-title">All Jobs</div>
      <div class="filters">
        <input id="jobs-search" type="text" placeholder="Search company or title..." style="min-width:260px">
        <select id="jobs-score">
          <option value="0">All scores</option>
          <option value="4">≥ 4.0</option>
          <option value="3">≥ 3.0</option>
        </select>
        <select id="jobs-fresh">
          <option value="all">All time</option>
          <option value="fresh">Fresh (&lt;48h)</option>
        </select>
        <button onclick="renderJobs()" class="btn" style="padding:8px 14px">Filter</button>
      </div>
      <div class="table-wrap">
        <table id="jobs-table">
          <thead><tr><th>Company</th><th>Role</th><th>Score</th><th>Location</th><th>Posted</th><th>Status</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <!-- Evaluations -->
    <section id="view-evaluations" class="view">
      <div class="section-title">Recent Evaluations</div>
      <div id="evaluations-list"></div>
    </section>

    <!-- Profile -->
    <section id="view-profile" class="view">
      <div class="section-title">Your Profile</div>
      <div class="profile" id="profile-card"></div>
    </section>
  </main>
</div>

<!-- Job / Eval Detail Modal -->
<div id="detail-modal" class="modal" onclick="if (event.target.id === 'detail-modal') closeModal()">
  <div class="modal-content" onclick="event.stopImmediatePropagation()">
    <div class="modal-header">
      <div>
        <div id="modal-company" style="font-size:13px;color:var(--muted)"></div>
        <h3 id="modal-title" style="font-size:19px; margin-top:2px"></h3>
      </div>
      <button class="close-btn" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body" id="modal-body">
      <!-- dynamic content -->
    </div>
  </div>
</div>

<script>
// ===== Data & State =====
const MOCK = {
  stats: { scanned: 287, evaluated: 61, applied: 24, offers: 3 },
  jobs: [
    { id: 101, company: 'Razorpay', title: 'Senior Backend Engineer', location: 'Bengaluru', score: 4.7, postedAt: new Date(Date.now()-8*3600*1000).toISOString(), status: 'evaluated' },
    { id: 102, company: 'PhonePe', title: 'Platform Engineer', location: 'Remote - India', score: 4.1, postedAt: new Date(Date.now()-38*3600*1000).toISOString(), status: 'applied' },
    { id: 103, company: 'CRED', title: 'Staff SRE', location: 'Bengaluru', score: 3.6, postedAt: new Date(Date.now()-90*3600*1000).toISOString(), status: 'scanned' },
    { id: 104, company: 'Zerodha', title: 'DevOps Engineer', location: 'Bengaluru', score: 4.9, postedAt: new Date(Date.now()-5*3600*1000).toISOString(), status: 'offer' },
    { id: 105, company: 'Groww', title: 'Engineering Manager', location: 'Remote', score: 4.3, postedAt: new Date(Date.now()-70*3600*1000).toISOString(), status: 'interview' },
  ],
  evaluations: [
    { id: 1, jobId: 101, company: 'Razorpay', title: 'Senior Backend Engineer', overallScore: 4.7,
      dimensions: { salary:5, stack:5, culture:4, growth:5, location:5, wlb:4, team:5, pmf:5, progression:4, dealbreakers:5 },
      matches: ['Node/TS', 'High scale payments', 'Strong culture'], mismatches: ['On-call rotation'],
      reasoning: 'Exceptional salary and tech alignment. Very high growth trajectory at a profitable fintech.', recommendation: 'Strong Apply', evaluatedAt: new Date().toISOString() }
  ],
  applications: [
    { id: 'a1', jobId: 101, company: 'Razorpay', title: 'Senior Backend Engineer', status: 'applied', appliedAt: new Date().toISOString() },
    { id: 'a2', jobId: 102, company: 'PhonePe', title: 'Platform Engineer', status: 'interview', appliedAt: new Date().toISOString() },
    { id: 'a3', jobId: 104, company: 'Zerodha', title: 'DevOps Engineer', status: 'offer', appliedAt: new Date().toISOString() },
    { id: 'a4', jobId: 105, company: 'Groww', title: 'Engineering Manager', status: 'evaluated', appliedAt: new Date().toISOString() }
  ],
  profile: {
    name: 'Your Name', currentRole: 'Senior Engineer', yearsOfExperience: 5,
    archetypes: ['Backend Engineer', 'Platform Engineer'], techStack: ['TypeScript', 'Go', 'AWS', 'Kubernetes', 'PostgreSQL'],
    salary: { min: 2800000, max: 4200000, currency: 'INR' }
  }
};

let state = { stats: null, jobs: [], evaluations: [], applications: [], profile: null };
let currentFilter = { view: 'pipeline' };

// ===== Helpers =====
function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `show ${type}`;
  setTimeout(() => t.classList.remove('show'), 2800);
}

async function fetchApi(path, fallback) {
  try {
    const r = await fetch(path);
    if (!r.ok) throw new Error();
    return await r.json();
  } catch {
    return JSON.parse(JSON.stringify(fallback));
  }
}

function animateCount(el, endVal) {
  const start = 0;
  const dur = 850;
  const t0 = performance.now();
  function tick(now) {
    const p = Math.min((now - t0) / dur, 1);
    const val = Math.floor(start + (endVal - start) * (1 - Math.pow(1 - p, 3)));
    el.textContent = val;
    if (p < 1) requestAnimationFrame(tick);
    else el.textContent = endVal;
  }
  requestAnimationFrame(tick);
}

function timeAgo(dateStr) {
  if (!dateStr) return '—';
  const diff = (Date.now() - new Date(dateStr)) / 3600000;
  if (diff < 1) return 'just now';
  if (diff < 24) return Math.floor(diff) + 'h ago';
  return Math.floor(diff / 24) + 'd ago';
}

// ===== Views & Navigation =====
function switchView(view, el) {
  document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
  if (el) el.classList.add('active');
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + view).classList.add('active');
}

function refreshAll() {
  init(true);
  showToast('Refreshed from local DB');
}

// ===== Modal =====
let modalEl;
function openModal(jobOrEval) {
  modalEl = document.getElementById('detail-modal');
  const body = document.getElementById('modal-body');
  const isEval = !!jobOrEval.dimensions;

  document.getElementById('modal-company').textContent = jobOrEval.company || '';
  document.getElementById('modal-title').textContent = jobOrEval.title || 'Job';

  let html = '';

  if (isEval) {
    const ev = jobOrEval;
    const dimRows = Object.entries(ev.dimensions || {}).map(([k, v]) => {
      const pct = Math.round(v * 20);
      return `<div class="dim-item"><div class="label-row"><span>${k}</span><span style="font-variant-numeric:tabular-nums">${v}/5</span></div>
        <div class="score-bar"><div class="score-fill" style="width:0%;background:${v>=4?'var(--green)':v>=3?'var(--amber)':'var(--red)'}"></div></div></div>`;
    }).join('');

    html = `
      <div style="display:flex;gap:12px;align-items:center;margin-bottom:14px">
        <span class="pill ${ev.overallScore >=4 ? 'g' : ev.overallScore>=3 ? 'a' : 'r'}" style="font-size:15px;padding:3px 12px">${ev.overallScore.toFixed(1)}</span>
        <span class="pill b">${ev.recommendation}</span>
      </div>
      <p style="color:#cbd5e1; margin: 4px 0 14px">${ev.reasoning}</p>
      <div style="margin-bottom:8px"><strong style="font-size:12px;color:var(--muted)">Matches</strong></div>
      <div class="chips">${(ev.matches||[]).map(m => `<span class="pill g">${m}</span>`).join('')}</div>
      <div style="margin-bottom:8px"><strong style="font-size:12px;color:var(--muted)">Watch-outs</strong></div>
      <div class="chips">${(ev.mismatches||[]).map(m => `<span class="pill r">${m}</span>`).join('')}</div>
      <div style="margin:18px 0 6px"><strong style="font-size:12px;color:var(--muted)">10-Dimension Breakdown</strong></div>
      <div class="dim-grid">${dimRows}</div>
    `;
  } else {
    const j = jobOrEval;
    html = `
      <div style="margin:4px 0 16px">
        <span class="pill outline">${j.location || '—'}</span>
        <span class="pill outline" style="margin-left:6px">${j.status || 'scanned'}</span>
        ${j.score ? `<span class="pill ${j.score>=4?'g':j.score>=3?'a':'r'}" style="margin-left:6px">${j.score.toFixed(1)}</span>` : ''}
        <span style="margin-left:10px;color:var(--muted);font-size:12.5px">${j.postedAt ? timeAgo(j.postedAt) : ''}</span>
      </div>
      <div style="margin-top:18px">
        <strong>Quick actions</strong>
        <div class="action-row">
          <button onclick="triggerAction('evaluate', ${j.id});closeModal()" class="btn">📊 Evaluate in CLI</button>
          <button onclick="triggerAction('resume', ${j.id});closeModal()" class="btn">📄 Generate Resume</button>
          <button onclick="triggerAction('prep', ${j.id});closeModal()" class="btn">🎯 Interview Prep</button>
          <button onclick="triggerAction('apply', ${j.id});closeModal()" class="btn">🚀 Apply / Auto-fill</button>
          <a href="#" onclick="window.open('https://www.google.com/search?q=${encodeURIComponent(j.company + ' ' + j.title)}', '_blank');return false" class="btn">🔗 View on web</a>
        </div>
      </div>
      <div style="margin-top:22px;font-size:12px;color:#64748b">Tip: Full details, resume generation and auto-fill happen in the terminal using <code>node hunt-job.js</code>.</div>
    `;
  }

  body.innerHTML = html;
  modalEl.classList.add('active');

  // trigger animated bars
  setTimeout(() => {
    body.querySelectorAll('.score-fill').forEach(el => {
      const w = el.style.width;
      el.style.width = '0%';
      requestAnimationFrame(() => { el.style.width = w; });
    });
  }, 90);
}
function closeModal() {
  if (modalEl) modalEl.classList.remove('active');
}

// ===== Kanban Pipeline =====
function renderPipeline() {
  const board = document.getElementById('kanban-board');
  board.innerHTML = '';
  const cols = ['scanned', 'evaluated', 'applied', 'interview', 'offer', 'rejected'];

  cols.forEach(col => {
    const colEl = document.createElement('div');
    colEl.className = 'column';

    const apps = state.applications.filter(a => a.status === col);
    colEl.innerHTML = `
      <div class="column-header">
        <span>${col[0].toUpperCase() + col.slice(1)}</span>
        <span class="column-count">${apps.length}</span>
      </div>
    `;

    const cardsWrap = document.createElement('div');
    cardsWrap.className = 'column-cards';

    cardsWrap.addEventListener('dragover', e => { e.preventDefault(); cardsWrap.classList.add('drag-over'); });
    cardsWrap.addEventListener('dragleave', () => cardsWrap.classList.remove('drag-over'));
    cardsWrap.addEventListener('drop', e => {
      e.preventDefault(); cardsWrap.classList.remove('drag-over');
      const id = e.dataTransfer.getData('text/plain');
      handleDrop(id, col);
    });

    apps.forEach(app => {
      const card = document.createElement('div');
      card.className = 'kanban-card';
      card.draggable = true;

      const ev = state.evaluations.find(e => e.jobId === app.jobId);
      const scoreHtml = ev ? `<span class="pill ${ev.overallScore >= 4 ? 'g' : ev.overallScore >= 3 ? 'a' : 'r'}">${ev.overallScore.toFixed(1)}</span>` : '';
      const fresh = state.jobs.find(j => j.id === app.jobId && j.postedAt && (Date.now() - new Date(j.postedAt) < 48*3600*1000)) ? `<span class="pill fresh">fresh</span>` : '';

      const initials = app.company.slice(0,2).toUpperCase();

      card.innerHTML = `
        <div class="company-row">
          <div class="avatar">${initials}</div>
          <div style="font-size:12.5px;color:var(--muted);font-weight:500">${app.company}</div>
        </div>
        <h4>${app.title}</h4>
        <div class="meta">
          ${scoreHtml}
          ${fresh}
        </div>
      `;

      card.addEventListener('click', () => {
        const job = state.jobs.find(jj => jj.id === app.jobId) || { id: app.jobId, company: app.company, title: app.title };
        openModal(job);
      });

      card.addEventListener('dragstart', e => {
        e.dataTransfer.setData('text/plain', app.id);
        setTimeout(() => card.classList.add('dragging'), 0);
      });
      card.addEventListener('dragend', () => card.classList.remove('dragging'));

      cardsWrap.appendChild(card);
    });

    colEl.appendChild(cardsWrap);
    board.appendChild(colEl);
  });
}

async function handleDrop(appId, newStatus) {
  const app = state.applications.find(a => a.id === appId);
  if (!app || app.status === newStatus) return;
  app.status = newStatus;

  renderPipeline();

  try {
    await fetch(`/api/applications/${encodeURIComponent(appId)}`, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status: newStatus })
    });
    showToast(`Moved to ${newStatus}`);
  } catch {
    showToast('Updated locally (offline mode)');
  }
}

// ===== Jobs table =====
function renderJobs() {
  const tbody = document.querySelector('#jobs-table tbody');
  tbody.innerHTML = '';

  const q = (document.getElementById('jobs-search')?.value || '').toLowerCase();
  const minS = parseFloat(document.getElementById('jobs-score')?.value || '0');
  const freshOnly = (document.getElementById('jobs-fresh')?.value || 'all') === 'fresh';

  const now = Date.now();

  state.jobs.forEach(job => {
    if (q && !(`${job.company} ${job.title}`.toLowerCase().includes(q))) return;
    if (job.score && job.score < minS) return;

    const isFresh = job.postedAt && ((now - new Date(job.postedAt).getTime()) / 3600000 < 48);
    if (freshOnly && !isFresh) return;

    const score = job.score ? `<span class="pill ${job.score>=4?'g':job.score>=3?'a':'r'}">${job.score.toFixed(1)}</span>` : '<span class="text-muted">—</span>';
    const posted = job.postedAt ? timeAgo(job.postedAt) : '—';

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><strong>${job.company}</strong></td>
      <td>${job.title} ${isFresh ? '<span class="pill fresh" style="margin-left:6px">fresh</span>' : ''}</td>
      <td>${score}</td>
      <td class="text-muted">${job.location || '—'}</td>
      <td class="text-muted">${posted}</td>
      <td><span class="pill outline">${job.status || 'scanned'}</span></td>
    `;
    tr.onclick = () => openModal(job);
    tbody.appendChild(tr);
  });
}

// ===== Evaluations =====
function renderEvaluations() {
  const container = document.getElementById('evaluations-list');
  container.innerHTML = '';

  if (!state.evaluations.length) {
    container.innerHTML = '<div class="empty">No evaluations yet. Run <code>node hunt-job.js evaluate "URL"</code></div>';
    return;
  }

  state.evaluations.forEach(ev => {
    const c = document.createElement('div');
    c.className = 'eval-card';

    const colorCls = ev.overallScore >= 4 ? 'g' : (ev.overallScore >= 3 ? 'a' : 'r');
    const dims = Object.entries(ev.dimensions || {}).map(([k, v]) =>
      `<div class="dim-item" data-score="${Math.floor(v)}">
         <div class="label-row"><span>${k}</span><span>${v}/5</span></div>
         <div class="score-bar"><div class="score-fill" style="width:${v*20}%"></div></div>
       </div>`).join('');

    c.innerHTML = `
      <div class="eval-summary" onclick="this.closest('.eval-card').classList.toggle('open')">
        <div>
          <strong>${ev.title}</strong>
          <span class="text-muted" style="margin-left:10px">${ev.company}</span>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <span class="pill ${colorCls}" style="padding:2px 10px">${ev.overallScore.toFixed(1)}</span>
          <span style="color:#64748b;font-size:11px">▾</span>
        </div>
      </div>
      <div class="eval-details">
        <p style="font-size:13.5px;color:#cbd5e1">${ev.reasoning}</p>
        <div class="chips" style="margin:10px 0 6px">
          ${(ev.matches||[]).map(m=>`<span class="pill g">${m}</span>`).join('')}
          ${(ev.mismatches||[]).map(m=>`<span class="pill r">${m}</span>`).join('')}
        </div>
        <div style="margin-top:6px"><span style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em">Dimensions</span></div>
        <div class="dim-grid">${dims}</div>
      </div>
    `;
    container.appendChild(c);
  });
}

// ===== Profile =====
function renderProfile() {
  const el = document.getElementById('profile-card');
  const p = state.profile || MOCK.profile;
  if (!p) { el.innerHTML = '<div class="empty">No profile. Run <code>npm run profile:init</code></div>'; return; }

  const arch = (p.archetypes || []).map(a => `<span class="pill outline">${a}</span>`).join(' ');
  const tech = (p.techStack || []).map(t => `<span class="pill outline">${t}</span>`).join(' ');
  const sal = p.salary ? `${p.salary.currency} ${(p.salary.min/100000).toFixed(1)}L — ${(p.salary.max/100000).toFixed(1)}L` : '—';

  el.innerHTML = `
    <h2>${p.name}</h2>
    <div class="role">${p.currentRole} · ${p.yearsOfExperience || '?'} years</div>
    <div style="margin:20px 0 12px"><span style="font-size:11px;color:var(--muted);text-transform:uppercase">Target Archetypes</span><div style="margin-top:6px">${arch || '—'}</div></div>
    <div style="margin:12px 0"><span style="font-size:11px;color:var(--muted);text-transform:uppercase">Tech Stack</span><div style="margin-top:6px">${tech || '—'}</div></div>
    <div><span style="font-size:11px;color:var(--muted);text-transform:uppercase">Salary Expectation</span>
      <div style="font-size:17px;font-weight:600;margin-top:2px">${sal}</div>
    </div>
  `;
}

// ===== Action hints (CLI) =====
function triggerAction(type, jobId) {
  const job = state.jobs.find(j => j.id === jobId) || {};
  let cmd = '';
  if (type === 'evaluate') cmd = `node hunt-job.js evaluate "${job.url || 'URL'}"`;
  if (type === 'resume') cmd = `node hunt-job.js resume ${jobId}`;
  if (type === 'prep') cmd = `node hunt-job.js prep "paste JD or path"`;
  if (type === 'apply') cmd = `node hunt-job.js (use interactive apply flow)`;
  showToast('Copy & run in terminal: ' + cmd);
  navigator.clipboard?.writeText(cmd).catch(()=>{});
}

// ===== Stats =====
function renderStats() {
  const s = state.stats || MOCK.stats;
  const map = {
    'stat-scanned': s.scanned,
    'stat-evaluated': s.evaluated,
    'stat-applied': s.applied,
    'stat-offers': s.offers || s.interviews || 0
  };
  Object.entries(map).forEach(([id, val]) => {
    const el = document.getElementById(id);
    if (el) animateCount(el, val || 0);
  });
}

// ===== Init =====
async function init(silent = false) {
  state.stats = await fetchApi('/api/stats', MOCK.stats);
  state.jobs = await fetchApi('/api/jobs', MOCK.jobs);
  state.evaluations = await fetchApi('/api/evaluations', MOCK.evaluations);
  state.applications = await fetchApi('/api/applications', MOCK.applications);
  state.profile = await fetchApi('/api/profile', MOCK.profile);

  renderStats();
  renderPipeline();
  renderJobs();
  renderEvaluations();
  renderProfile();

  // wire filters once
  if (!window._filtersWired) {
    ['jobs-search', 'jobs-score', 'jobs-fresh'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.addEventListener('input', renderJobs);
    });
    window._filtersWired = true;
  }

  if (!silent) {
    // subtle first-load animation hint
    setTimeout(() => {
      document.querySelectorAll('.kanban-card').forEach((c, i) => {
        c.style.animation = `pop ${320 + i * 30}ms ease`;
      });
    }, 140);
  }
}

// Boot
window.addEventListener('load', () => {
  init();
  // Keyboard: / focuses search in jobs view
  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement.tagName === 'BODY') {
      e.preventDefault();
      const jobsView = document.getElementById('view-jobs');
      if (!jobsView.classList.contains('active')) {
        document.querySelector('[data-view="jobs"]').click();
      }
      document.getElementById('jobs-search')?.focus();
    }
    if (e.key === 'Escape') {
      document.getElementById('detail-modal')?.classList.remove('active');
    }
  });
  // helpful first tip
  setTimeout(() => {
    if (!localStorage.getItem('hj_tipped')) {
      // no persistent spam
    }
  }, 6000);
});

function showHint() {
  const text = `Essential commands:
• npm start
• node hunt-job.js hunt --archetype "Backend Engineer"
• node hunt-job.js scan --archetype "..."
• node hunt-job.js watch --archetype "SRE"
• npm run dashboard
• node hunt-job.js evaluate "URL"
• node hunt-job.js audit-portals`;
  alert(text);
}
</script>
