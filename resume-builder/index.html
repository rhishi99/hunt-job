<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resume Builder — Hunt Job</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
/* ============================ RESET ============================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --fit: 1; --ui-accent: #4ecca3; --edit-glow: rgba(90,150,255,0.16); --edit-line: rgba(90,150,255,0.55); }

/* ============================ APP CHROME ============================ */
body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: #0c0c1a; min-height: 100vh; color: #fff; }

#toolbar {
  position: fixed; top: 0; left: 0; right: 0; min-height: 58px;
  background: #12122a; border-bottom: 1px solid rgba(255,255,255,0.08);
  display: flex; flex-wrap: wrap; align-items: center; padding: 8px 16px; gap: 10px; z-index: 1000;
  box-shadow: 0 2px 20px rgba(0,0,0,0.4);
}
.toolbar-logo { font-weight: 800; font-size: 15px; color: #fff; white-space: nowrap; letter-spacing: -0.3px; }
.toolbar-logo span { color: var(--ui-accent); }
.toolbar-divider { width: 1px; height: 24px; background: rgba(255,255,255,0.12); flex-shrink: 0; }

#template-strip-wrap { position: relative; display: flex; align-items: center; flex: 1; min-width: 220px; }
#template-btns {
  display: flex; gap: 5px; flex: 1; overflow-x: auto; padding: 3px 2px; min-width: 0;
  scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.25) transparent;
}
#template-btns::-webkit-scrollbar { height: 5px; }
#template-btns::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.25); border-radius: 3px; }
.strip-fade { position: absolute; top: 0; bottom: 0; width: 22px; pointer-events: none; z-index: 2; }
.strip-fade.l { left: 0; background: linear-gradient(to right, #12122a, transparent); }
.strip-fade.r { right: 0; background: linear-gradient(to left, #12122a, transparent); }
.tpl-btn {
  padding: 5px 12px; border-radius: 16px; border: 1.5px solid rgba(255,255,255,0.14);
  cursor: pointer; font-size: 11.5px; font-weight: 500; color: rgba(255,255,255,0.72);
  background: transparent; white-space: nowrap; transition: all 0.18s;
}
.tpl-btn:hover { color: #fff; border-color: rgba(255,255,255,0.35); }
.tpl-btn[aria-selected="true"] { color: var(--ui-accent); border-color: var(--ui-accent); background: rgba(78,204,163,0.12); font-weight: 600; }

.toolbar-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.btn {
  padding: 7px 12px; border-radius: 7px; border: none; cursor: pointer; font-size: 12px;
  font-weight: 600; font-family: inherit; transition: all 0.15s; white-space: nowrap;
  display: inline-flex; align-items: center; gap: 5px;
}
.btn-ghost { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.78); border: 1px solid rgba(255,255,255,0.12); }
.btn-ghost:hover:not(:disabled) { background: rgba(255,255,255,0.14); color: #fff; }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }
.btn-danger { color: #ff8b7d; border-color: rgba(231,76,60,0.35); }
.btn-export { background: var(--ui-accent); color: #0c0c1a; }
.btn-export:hover { background: #3bb88d; }
.btn svg { width: 14px; height: 14px; }
.btn:focus-visible, .tpl-btn:focus-visible { outline: 2px solid #8ab4ff; outline-offset: 2px; }

#save-state {
  font-size: 11px; color: rgba(255,255,255,0.5); white-space: nowrap; min-width: 62px;
  display: inline-flex; align-items: center; gap: 4px;
}
#save-state.saving { color: #f4c761; }
#save-state.saved { color: var(--ui-accent); }

#edit-hint {
  position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
  background: rgba(12,12,26,0.9); backdrop-filter: blur(8px);
  border: 1px solid rgba(78,204,163,0.28); color: rgba(255,255,255,0.75); font-size: 11px;
  padding: 7px 12px 7px 16px; border-radius: 20px; z-index: 900; display: flex; align-items: center; gap: 10px;
}
#edit-hint button { background: none; border: none; color: rgba(255,255,255,0.6); font-size: 14px; cursor: pointer; line-height: 1; }
#edit-hint button:hover { color: #fff; }

/* ============================ FIT-TO-WIDTH SCALER ============================ */
#app-body { margin-top: 66px; padding: 28px 20px 90px; display: flex; justify-content: center; }
#resume-scaler { width: calc(794px * var(--fit)); }
#resume-wrapper {
  width: 794px; background: #fff; box-shadow: 0 12px 80px rgba(0,0,0,0.5);
  transform: scale(var(--fit)); transform-origin: top left; color: #333;
}

/* ============================ EDITABLE ============================ */
[contenteditable="true"] { outline: none; cursor: text; border-radius: 2px; transition: background 0.15s, box-shadow 0.15s; }
[contenteditable="true"]:hover { background: var(--edit-glow); }
[contenteditable="true"]:focus { background: var(--edit-glow); box-shadow: 0 0 0 1.5px var(--edit-line); }
[contenteditable="true"]:empty::before { content: attr(data-ph); color: #b9b9c4; }

/* company · location — separator + placeholder come from :empty, never a class */
.cl-loc:empty:not(:focus)::before { content: "+ location"; color: #bcbcc6; font-weight: 400; font-style: normal; }
.cl-loc:not(:empty)::before { content: "·"; margin: 0 5px; color: #a7a7b2; }
.opt-add {
  display: inline-block; font-size: 10px; color: #9aa0b4; border: 1px dashed rgba(120,130,160,0.5);
  border-radius: 10px; padding: 1px 7px; cursor: pointer; background: none; font-family: inherit; margin-top: 3px;
}
.opt-add:hover { color: #4a5568; border-color: rgba(120,130,160,0.9); }

/* ============================ BULLET / TAG CONTROLS ============================ */
.bullet-row { display: flex; align-items: flex-start; gap: 4px; position: relative; }
.bullet-ctrl { display: flex; gap: 2px; flex-shrink: 0; opacity: 0; transition: opacity 0.15s; padding-top: 2px; }
.bullet-row:hover .bullet-ctrl, .bullet-ctrl:focus-within { opacity: 1; }
.del-bullet, .add-bullet-after {
  width: 16px; height: 16px; border-radius: 50%; border: none; cursor: pointer; font-size: 11px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0; line-height: 1;
}
.del-bullet { background: #e74c3c; color: #fff; }
.del-bullet:hover { background: #c0392b; }
.add-bullet-after { background: var(--ui-accent); color: #0c0c1a; }
.add-bullet-after:hover { background: #3bb88d; }
.del-bullet:focus-visible, .add-bullet-after:focus-visible, .tag-del:focus-visible, .add-tag-btn:focus-visible, .entry-del:focus-visible {
  outline: 2px solid #8ab4ff; outline-offset: 1px;
}

.tag-wrap { position: relative; display: inline-flex; align-items: center; }
.tag-del {
  display: none; position: absolute; top: -5px; right: -5px;
  width: 14px; height: 14px; border-radius: 50%; border: none;
  background: #e74c3c; color: #fff; font-size: 9px; cursor: pointer;
  align-items: center; justify-content: center; line-height: 1;
}
.tag-wrap:hover .tag-del, .tag-wrap:focus-within .tag-del { display: flex; }
.add-tag-btn {
  border: 1px dashed rgba(78,204,163,0.5); background: transparent; color: #1d6f68;
  border-radius: 12px; font-size: 11px; padding: 2px 9px; cursor: pointer; font-family: inherit;
}
.add-tag-btn:hover { background: rgba(78,204,163,0.1); }

/* entry (job / edu / cert / lang) delete */
.entry { position: relative; }
.entry-del {
  position: absolute; top: 0; right: 0; width: 16px; height: 16px; border-radius: 50%;
  border: none; background: #e74c3c; color: #fff; font-size: 10px; cursor: pointer;
  opacity: 0; transition: opacity 0.15s; display: flex; align-items: center; justify-content: center; line-height: 1;
}
.entry:hover .entry-del, .entry:focus-within .entry-del { opacity: 1; }

/* inline contact icon */
.ci { display: inline-block; width: 11px; height: 11px; vertical-align: -1px; flex-shrink: 0; }
.ci svg { width: 100%; height: 100%; fill: currentColor; }

/* ================================================
   TEMPLATE 1: CLASSIC
   ================================================ */
.resume-classic { font-family: 'Segoe UI', Arial, sans-serif; color: #333; }
.rc-header { background: #1d2b37; padding: 26px 28px 22px; display: flex; justify-content: space-between; align-items: flex-start; }
.rc-header-left { flex: 1; }
.rc-name { font-size: 26px; font-weight: 700; color: #fff; margin-bottom: 3px; line-height: 1.15; display: block; }
.rc-title { font-size: 13px; color: #4ecca3; font-weight: 500; margin-bottom: 10px; display: block; }
.rc-summary { font-size: 11.5px; color: rgba(255,255,255,0.82); line-height: 1.55; max-width: 90%; display: block; }
.rc-photo {
  width: 78px; height: 78px; border-radius: 8px; border: 2px solid rgba(255,255,255,0.18);
  background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center;
  font-size: 9px; color: rgba(255,255,255,0.4); text-align: center;
  cursor: pointer; overflow: hidden; flex-shrink: 0; margin-left: 20px;
}
.rc-photo img { width: 100%; height: 100%; object-fit: cover; }
.rc-contact { background: #152330; display: flex; flex-wrap: wrap; }
.rc-contact-item { display: flex; align-items: center; gap: 6px; padding: 7px 16px; font-size: 11px; color: #9ec5d0; border-right: 1px solid rgba(255,255,255,0.06); }
.rc-contact-item .ci { color: #4ecca3; }
.rc-body { display: grid; grid-template-columns: 58% 42%; }
.rc-left { padding: 18px 18px 18px 22px; border-right: 1px solid #ebebeb; }
.rc-right { padding: 18px; }
.rc-section-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: #1d6f68; border-bottom: 1.5px solid #4ecca3; padding-bottom: 4px; margin-bottom: 11px; margin-top: 16px; }
.rc-left .rc-section-title:first-child, .rc-right .rc-section-title:first-child { margin-top: 0; }
.rc-exp-title { font-size: 13px; font-weight: 700; color: #1d2b37; display: block; }
.rc-exp-company-line { font-size: 11.5px; font-weight: 600; color: #333; margin-bottom: 2px; }
.rc-exp-period { font-size: 10.5px; color: #1d6f68; font-style: italic; margin: 2px 0 3px; display: block; }
.rc-exp-desc { font-size: 11px; color: #666; font-style: italic; margin-bottom: 5px; line-height: 1.4; display: block; }
.rc-exp-tag { font-size: 10px; color: #1d6f68; font-weight: 600; margin-bottom: 4px; }
.rc-exp-block { margin-bottom: 14px; padding-right: 18px; }
.rc-bullet-row { display: flex; align-items: flex-start; gap: 6px; margin-bottom: 4px; }
.rc-bullet-row:hover .bullet-ctrl { opacity: 1; }
.rc-bullet-dot { width: 6px; height: 6px; background: #4ecca3; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
.rc-bullet-text { font-size: 11px; color: #444; line-height: 1.48; flex: 1; }
.rc-skill-tag { display: inline-block; border: 1px solid #4ecca3; color: #1d6f68; font-size: 10.5px; padding: 3px 9px; border-radius: 12px; background: transparent; margin: 0 4px 4px 0; }
.rc-edu-item { margin-bottom: 10px; }
.rc-edu-degree { font-size: 12px; font-weight: 700; color: #1d2b37; display: block; }
.rc-edu-inst { font-size: 11px; color: #444; display: block; }
.rc-edu-period { font-size: 10.5px; color: #1d6f68; font-style: italic; display: block; }
.rc-cert-name { font-size: 12px; font-weight: 600; color: #1d2b37; display: block; }
.rc-cert-period { font-size: 10.5px; color: #777; display: block; }
.rc-cert-desc { font-size: 10.5px; color: #888; font-style: italic; display: block; }
.rc-lang-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.rc-lang-name { font-size: 12px; font-weight: 600; color: #1d2b37; display: block; }
.rc-lang-level { font-size: 10.5px; color: #1d6f68; font-style: italic; display: block; }
.rc-interest-tag { display: inline-block; background: #f0faf8; border: 1px solid #c5e8e2; color: #1d6f68; font-size: 10.5px; padding: 3px 9px; border-radius: 12px; margin: 0 4px 4px 0; }

/* ================================================
   TEMPLATE 2: MINIMALIST PRO
   ================================================ */
.resume-minimalist { font-family: 'Inter', 'Segoe UI', sans-serif; color: #1a1a1a; padding: 44px 46px; }
.rm-name { font-size: 30px; font-weight: 800; color: #111; letter-spacing: -0.5px; margin-bottom: 3px; display: block; }
.rm-title { font-size: 13px; color: #555; font-weight: 500; margin-bottom: 10px; display: block; }
.rm-contact { display: flex; flex-wrap: wrap; gap: 14px; font-size: 11.5px; color: #555; margin-bottom: 14px; }
.rm-contact-item { display: flex; align-items: center; gap: 5px; }
.rm-contact-item .ci { color: #4ecca3; }
.rm-summary { font-size: 12px; color: #444; line-height: 1.65; border-left: 3px solid #4ecca3; padding-left: 12px; margin-bottom: 22px; display: block; }
.rm-divider { height: 1px; background: #eee; margin-bottom: 20px; }
.rm-body { display: grid; grid-template-columns: 62% 38%; gap: 28px; }
.rm-section-title { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: #1d6f68; margin-bottom: 12px; }

.rm-exp-period { font-size: 10.5px; color: #888; margin: 2px 0 6px; display: block; }
.rm-exp-block { margin-bottom: 16px; }
.rm-bullet-row { display: flex; align-items: flex-start; gap: 4px; margin-bottom: 3px; }
.rm-bullet-dash { font-size: 11px; color: #4ecca3; flex-shrink: 0; line-height: 1.5; margin-top: 1px; user-select: none; }
.rm-bullet-text { font-size: 11.5px; color: #333; line-height: 1.55; flex: 1; }
.rm-skill-chip { display: inline-block; background: #f4f4f4; color: #333; font-size: 10.5px; padding: 3px 9px; border-radius: 4px; margin: 0 4px 4px 0; }
.rm-edu-item { margin-bottom: 11px; }
.rm-edu-degree { font-size: 12.5px; font-weight: 600; display: block; }
.rm-edu-inst { font-size: 11px; color: #666; display: block; }
.rm-edu-period { font-size: 10.5px; color: #888; display: block; }
.rm-cert-name { font-size: 12px; font-weight: 600; display: block; }
.rm-cert-sub { font-size: 10.5px; color: #888; display: block; }
.rm-lang-item { margin-bottom: 7px; }
.rm-lang-name { font-size: 12px; font-weight: 600; display: block; }
.rm-lang-level { font-size: 10.5px; color: #888; display: block; }
.rm-tag { display: inline-block; background: #f0fdf9; color: #1d6f68; border: 1px solid #b2e2d6; font-size: 10.5px; padding: 2px 8px; border-radius: 3px; margin: 2px 4px 0 0; }

/* ================================================
   TEMPLATE 3: AZURE SIDEBAR
   ================================================ */
.resume-sidebar { font-family: 'Inter', 'Segoe UI', sans-serif; display: grid; grid-template-columns: 30% 70%; }
.rs-sidebar { background: #1a3a5c; color: #fff; padding: 30px 18px; }
.rs-main { background: #fff; color: #1a1a1a; padding: 30px 22px; }
.rs-photo-area {
  width: 88px; height: 88px; border-radius: 50%; background: rgba(255,255,255,0.12);
  border: 3px solid rgba(255,255,255,0.25); margin: 0 auto 14px; display: flex;
  align-items: center; justify-content: center; font-size: 9px; color: rgba(255,255,255,0.5);
  cursor: pointer; overflow: hidden;
}
.rs-photo-area img { width: 100%; height: 100%; object-fit: cover; }
.rs-sb-name { font-size: 14px; font-weight: 700; text-align: center; margin-bottom: 3px; display: block; }
.rs-sb-title { font-size: 9.5px; color: rgba(255,255,255,0.7); text-align: center; margin-bottom: 18px; display: block; }
.rs-sb-section { margin-bottom: 16px; }
.rs-sb-label { font-size: 8.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.8px; color: #4ecca3; margin-bottom: 7px; border-bottom: 1px solid rgba(78,204,163,0.3); padding-bottom: 3px; }
.rs-sb-contact-item { display: flex; align-items: flex-start; gap: 6px; font-size: 10px; color: rgba(255,255,255,0.82); margin-bottom: 5px; line-height: 1.35; word-break: break-word; }
.rs-sb-contact-item .ci { color: #4ecca3; margin-top: 1px; }
.rs-sb-skill-tag { display: inline-block; background: rgba(255,255,255,0.1); border: 1px solid rgba(78,204,163,0.4); color: rgba(255,255,255,0.9); font-size: 9.5px; padding: 2px 7px; border-radius: 10px; margin: 2px 4px 0 0; }
.rs-sb-lang-item { margin-bottom: 6px; }
.rs-sb-lang-name { font-size: 11.5px; font-weight: 600; display: block; }
.rs-sb-lang-level { font-size: 9.5px; color: rgba(255,255,255,0.62); display: block; }
.rs-sb-interest-tag { display: inline-block; font-size: 9.5px; color: rgba(255,255,255,0.75); background: rgba(255,255,255,0.07); border-radius: 3px; padding: 2px 6px; margin: 2px 4px 0 0; }
.rs-main-name { font-size: 24px; font-weight: 800; color: #1a3a5c; margin-bottom: 2px; display: block; }
.rs-main-title { font-size: 12px; color: #1d6f68; font-weight: 600; margin-bottom: 10px; display: block; }
.rs-main-summary { font-size: 11.5px; color: #555; line-height: 1.6; border-bottom: 1px solid #eee; padding-bottom: 14px; margin-bottom: 14px; display: block; }
.rs-section-title { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.8px; color: #1a3a5c; border-left: 3px solid #4ecca3; padding-left: 8px; margin-bottom: 11px; margin-top: 16px; }
.rs-section-title:first-of-type { margin-top: 0; }
.rs-exp-title { font-size: 13px; font-weight: 700; color: #1a3a5c; display: block; }
.rs-exp-company-line { font-size: 11px; color: #444; margin-bottom: 1px; }
.rs-exp-period { font-size: 10.5px; color: #1d6f68; margin: 2px 0 5px; display: block; }
.rs-exp-desc { font-size: 11px; color: #666; font-style: italic; margin-bottom: 5px; display: block; }
.rs-exp-block { margin-bottom: 15px; }
.rs-bullet-row { display: flex; align-items: flex-start; gap: 5px; margin-bottom: 3px; }
.rs-bullet-mark { color: #4ecca3; font-weight: 700; flex-shrink: 0; margin-top: 1px; font-size: 12px; user-select: none; }
.rs-bullet-text { font-size: 11px; color: #444; line-height: 1.48; flex: 1; }
.rs-edu-item { margin-bottom: 10px; }
.rs-edu-degree { font-size: 12px; font-weight: 600; color: #1a3a5c; display: block; }
.rs-edu-inst { font-size: 10.5px; color: #555; display: block; }
.rs-edu-period { font-size: 10.5px; color: #888; display: block; }

   TEMPLATE 4: EXECUTIVE
   ================================================ */

.re-header { text-align: center; padding: 30px 36px 18px; border-bottom: 3px solid #1a1a6e; }

.re-section-title { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: #1a1a6e; border-bottom: 2px solid #1a1a6e; padding-bottom: 4px; margin-bottom: 11px; margin-top: 16px; font-family: 'Inter', sans-serif; }
.re-left .re-section-title:first-child, .re-right .re-section-title:first-child { margin-top: 0; }
.re-exp-title { font-size: 13px; font-weight: 700; color: #1a1a2e; display: block; }
.re-exp-company-line { font-size: 11.5px; font-style: italic; color: #1a1a6e; font-weight: 600; }
.re-exp-period { font-size: 10.5px; color: #888; margin: 2px 0 5px; display: block; }
.re-exp-desc { font-size: 11px; color: #555; font-style: italic; margin-bottom: 5px; line-height: 1.4; display: block; }
.re-exp-block { margin-bottom: 14px; }
.re-bullet-row { display: flex; align-items: flex-start; gap: 6px; margin-bottom: 3px; }
.re-bullet-mark { color: #1a1a6e; flex-shrink: 0; font-size: 9px; margin-top: 4px; user-select: none; }
.re-bullet-text { font-size: 11.5px; color: #333; line-height: 1.5; flex: 1; font-family: 'Georgia', serif; }
.re-skill-wrap { font-size: 11.5px; color: #333; line-height: 1.7; }
.re-skill-bullet { color: #1a1a6e; font-size: 9px; user-select: none; }
.re-skill-text { font-size: 11.5px; color: #333; }
.re-edu-item { margin-bottom: 11px; }
.re-edu-degree { font-size: 12.5px; font-weight: 700; display: block; }
.re-edu-inst { font-size: 11.5px; color: #555; font-style: italic; display: block; }
.re-edu-period { font-size: 10.5px; color: #888; display: block; }

function ce(id, text, cls, ph) {
  return `<span class="${cls}" contenteditable="true" data-id="${id}"${ph ? ` data-ph="${esc(ph)}"` : ''}>${esc(text)}</span>`;
}

function mkBullet(ei, bi, text, rowCls, markerCls, markerChar, textCls) {
  return `
<div class="${rowCls}">
  <span class="bullet-ctrl">
    <button class="del-bullet" onclick="deleteBulletById('experience.${ei}.bullets.${bi}')" title="Remove bullet" aria-label="Remove bullet">&times;</button>

  </span>
  <span class="${markerCls}" aria-hidden="true">${markerChar}</span>
  <span class="${textCls}" contenteditable="true" data-id="experience.${ei}.bullets.${bi}">${esc(text)}</span>
</div>`;
}

function tagWrap(text, dataId, tagClass) {
  return `<span class="tag-wrap"><span class="${tagClass}" contenteditable="true" data-id="${dataId}">${esc(text)}</span><button class="tag-del" onclick="deleteTagById('${dataId}')" title="Remove" aria-label="Remove">&times;</button></span>`;
}

// company + always-present (possibly empty) location, as two separate editable fields.
// The "·" separator and "+ location" hint are CSS :empty pseudo-content — never real text.
function companyLoc(ei, exp) {
  return `<span class="cl-company" contenteditable="true" data-id="experience.${ei}.company">${esc(exp.company)}</span>` +
    `<span class="cl-loc" contenteditable="true" data-id="experience.${ei}.location">${esc(exp.location || '')}</span>`;
}

function optAdd(dataId, label) {
  return `<button class="opt-add" onclick="addOptional('${dataId}')">${esc(label)}</button>`;
}

function entryDel(section, i) {
  return `<button class="entry-del" onclick="removeEntry('${section}', ${i})" title="Remove entry" aria-label="Remove entry">&times;</button>`;
}

function addBtn(fn, label) {
  return `<button class="add-tag-btn" onclick="${fn}">${esc(label)}</button>`;
}

// flat skill tags — editable, stable data-id = index into D.skills.
// (D.skillGroups is display metadata for the server-side CLI generator, which
//  never edits; the interactive builder edits the flat list to avoid desync.)
function skillsHtml(d, tagCls, joiner) {
  return d.skills.map((s, si) => tagWrap(s, `skills.${si}`, tagCls)).join(joiner || '') +
    ' ' + addBtn('addSkill()', '+ add');
}

        ${ce(`education.${ei}.degree`, e.degree, 'ra-edu-degree')}
        ${ce(`education.${ei}.institution`, e.institution, 'ra-edu-inst')}
      </div>
      ${e.period ? ce(`education.${ei}.period`, e.period, 'ra-edu-period') : `<span>${optAdd(`education.${ei}.period`, '+ dates')}</span>`}
    </div>
  </div>`).join('') + addBtn("addEntry('education')", '+ education');

  const certs = d.certificates.map((c, ci) => `
  <div class="entry" style="margin-bottom:8px">
    ${entryDel('certificates', ci)}
    ${ce(`certificates.${ci}.name`, c.name, 'ra-cert-name')}
    ${ce(`certificates.${ci}.period`, c.period, 'ra-cert-period', 'dates')}
    ${ce(`certificates.${ci}.desc`, c.desc, 'ra-cert-desc', 'description')}
  </div>`).join('') + addBtn("addEntry('certificates')", '+ certificate');

  return `<div class="resume-ats">
  <h1 class="ra-name" contenteditable="true" data-id="name">${esc(d.name)}</h1>
  ${ce('title', d.title, 'ra-title')}
  <div class="ra-contact">
    <span contenteditable="true" data-id="contact.email">${esc(d.contact.email)}</span> |
    <span contenteditable="true" data-id="contact.phone">${esc(d.contact.phone)}</span> |
    <span contenteditable="true" data-id="contact.location">${esc(d.contact.location)}</span> |
    <span contenteditable="true" data-id="contact.linkedin">${esc(d.contact.linkedin)}</span>
  </div>
  ${ce('summary', d.summary, 'ra-summary')}

  <div class="ra-section-title">Professional Experience</div>
  ${expHtml}
  <div style="margin-top:4px">${addBtn('addExperience()', '+ job')}</div>

  <div class="ra-section-title">Technical Skills</div>
  <div class="ra-skill-wrap">
    ${d.skills.map((s, si) => tagWrap(s, `skills.${si}`, 'ra-skill')).join(' ')}
    ${addBtn('addSkill()', '+ add')}
  </div>

  <div class="ra-section-title">Education</div>
  ${edu}

  <div class="ra-section-title">Certifications</div>
  ${certs}

  <div class="ra-section-title">Languages</div>
  <div class="ra-lang-item">
    ${d.languages.map((l, li) => `<span class="tag-wrap"><span contenteditable="true" data-id="languages.${li}.name">${esc(l.name)}</span>&nbsp;&mdash;&nbsp;<span contenteditable="true" data-id="languages.${li}.level">${esc(l.level)}</span><button class="tag-del" onclick="removeEntry('languages',${li})" aria-label="Remove">&times;</button></span>`).join('&nbsp;&middot; ')}
    ${addBtn("addEntry('languages')", '+ add')}
  </div>

  <div class="ra-section-title">Interests</div>
  <div class="ra-interests">
    ${d.interests.map((t, ti) => `<span class="tag-wrap"><span contenteditable="true" data-id="interests.${ti}">${esc(t)}</span><button class="tag-del" onclick="deleteTagById('interests.${ti}')" aria-label="Remove">&times;</button></span>`).join(' &middot; ')}
    ${addBtn('addInterest()', '+ add')}
  </div>
</div>`;
}

// ============================================================
// RENDER DISPATCH
// ============================================================
const renderers = { classic: renderClassic, minimalist: renderMinimalist, sidebar: renderSidebar, executive: renderExecutive, bold: renderBold, ats: renderATS };

// ============================================================
// DATA EXTRACTION
// ============================================================
function extractEdits() {
  const wrap = document.getElementById('resume-wrapper');
  if (!wrap) return;

  const values = new Map();
  wrap.querySelectorAll('[data-id]').forEach(el => {
    const id = el.dataset.id;
    if (!values.has(id)) values.set(id, el.innerText.replace(/\s+/g, ' ').trim());
  });

  lastFocused.forEach((el, id) => {
    if (el.isConnected) values.set(id, el.innerText.replace(/\s+/g, ' ').trim());
  });

  values.forEach((val, id) => setVal(id, val));
  lastFocused.clear();
}

function setVal(path, val) {
  const parts = path.split('.');
  let obj = D;
  for (let i = 0; i < parts.length - 1; i++) {
    const k = isNaN(parts[i]) ? parts[i] : parseInt(parts[i]);
    if (obj == null || obj[k] == null) return;
    obj = obj[k];
  }
  const last = parts[parts.length - 1];
  const key = isNaN(last) ? last : parseInt(last);
  if (obj && typeof obj === 'object') obj[key] = val;
}


// ============================================================
// UNDO / REDO
// ============================================================
let undoStack = [], redoStack = [];
function snapshot() {
  const s = JSON.stringify(D);
  if (undoStack[undoStack.length - 1] === s) return;
  undoStack.push(s);
  if (undoStack.length > 30) undoStack.shift();
  redoStack = [];
  updateUndoButtons();
}
function undo() {
  extractEdits();
  if (!undoStack.length) return;
  redoStack.push(JSON.stringify(D));
  D = JSON.parse(undoStack.pop());
  render(currentTpl);
  updateUndoButtons();
}
function redo() {
  if (!redoStack.length) return;
  undoStack.push(JSON.stringify(D));
  D = JSON.parse(redoStack.pop());
  render(currentTpl);
  updateUndoButtons();
}
function updateUndoButtons() {
  document.getElementById('btn-undo').disabled = !undoStack.length;
  document.getElementById('btn-redo').disabled = !redoStack.length;
}

// ============================================================
// RENDER
// ============================================================
// render() paints D as-is. It does NOT pull from the DOM — callers that may have
// uncommitted inline edits (template switch) must call extractEdits() first.
// Callers that already hold the authoritative D (undo/redo/import/add/delete,
// which each call extractEdits() themselves before mutating) must NOT, or the
// stale pre-render DOM would stomp the change.
function render(tplId) {
  currentTpl = tplId;
  const wrap = document.getElementById('resume-wrapper');
  wrap.innerHTML = renderers[tplId](D);

  // ARIA on every editable field, derived from data-id
  wrap.querySelectorAll('[data-id]').forEach(el => {
    el.setAttribute('role', 'textbox');
    el.setAttribute('aria-multiline', el.dataset.id.includes('bullets') || el.dataset.id === 'summary' ? 'true' : 'false');
    el.setAttribute('aria-label', el.dataset.id.replace(/\./g, ' ').replace(/\b(\d+)\b/g, (m) => '#' + (parseInt(m) + 1)));
  });

  updateToolbar();
  saveToStorage();
  fitScale();
}

function updateToolbar() {
  document.querySelectorAll('.tpl-btn').forEach(btn => {
    btn.setAttribute('aria-selected', btn.dataset.tpl === currentTpl ? 'true' : 'false');
  });
}

// ============================================================
// ADD / DELETE
// ============================================================
function resolveArray(path) {
  const parts = path.split('.');
  let arr = D;
  for (const p of parts.slice(0, -1)) arr = arr[isNaN(p) ? p : parseInt(p)];
  return { arr, idx: parseInt(parts[parts.length - 1]) };
}

function deleteBulletById(dataId) {
  snapshot(); extractEdits();
  const { arr, idx } = resolveArray(dataId);
  if (Array.isArray(arr)) { arr.splice(idx, 1); render(currentTpl); }
}
function addBulletAfter(dataId) {
  snapshot(); extractEdits();
  const { arr, idx } = resolveArray(dataId);
  if (Array.isArray(arr)) { arr.splice(idx + 1, 0, 'New achievement or responsibility'); render(currentTpl); }
}
function addBulletToExp(expIdx) {
  snapshot(); extractEdits();
  D.experience[expIdx].bullets.push('New achievement or responsibility');
  render(currentTpl);
}
function deleteTagById(dataId) {
  snapshot(); extractEdits();
  const { arr, idx } = resolveArray(dataId);
  if (Array.isArray(arr)) { arr.splice(idx, 1); render(currentTpl); }
}
function addSkill() { snapshot(); extractEdits(); D.skills.push('New Skill'); render(currentTpl); }
function addInterest() { snapshot(); extractEdits(); D.interests.push('New Interest'); render(currentTpl); }
function addExperience() {
  snapshot(); extractEdits();
  D.experience.push({ title: 'Job Title', company: 'Company Name', location: '', period: 'MM/YYYY – MM/YYYY', desc: '', bullets: ['Key achievement or responsibility'] });
  render(currentTpl);
}

const ENTRY_TEMPLATES = {
  experience: () => ({ title: 'Job Title', company: 'Company Name', location: '', period: 'MM/YYYY – MM/YYYY', desc: '', bullets: ['Key achievement or responsibility'] }),
  education: () => ({ degree: 'Degree', institution: 'Institution', period: '' }),
  certificates: () => ({ name: 'Certificate Name', period: '', desc: '' }),
  languages: () => ({ name: 'Language', level: 'Proficiency' }),
};
function addEntry(section) {
  snapshot(); extractEdits();
  if (!Array.isArray(D[section])) D[section] = [];
  D[section].push(ENTRY_TEMPLATES[section] ? ENTRY_TEMPLATES[section]() : '');
  render(currentTpl);
}
function removeEntry(section, i) {
  snapshot(); extractEdits();
  if (Array.isArray(D[section])) { D[section].splice(i, 1); render(currentTpl); }
}
function addOptional(dataId) {
  snapshot(); extractEdits();
  setVal(dataId, dataId.endsWith('.period') ? 'MM/YYYY – MM/YYYY' : 'Short description');
  render(currentTpl);
}

// ============================================================
// PHOTO
// ============================================================
function triggerPhotoUpload() { document.getElementById('photo-input').click(); }
document.getElementById('photo-input').addEventListener('change', function (e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => { snapshot(); extractEdits(); D.photo = ev.target.result; render(currentTpl); };
  reader.readAsDataURL(file);
  this.value = '';
});

// ============================================================
// JSON IMPORT / EXPORT
// ============================================================
function safeFilename() {
  return (D.name || 'resume').trim().replace(/[^\w]+/g, '_').replace(/^_+|_+$/g, '') || 'resume';
}
function exportJSON() {
  extractEdits();
  const blob = new Blob([JSON.stringify(D, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = safeFilename() + '_resume.json';
  a.click();
  URL.revokeObjectURL(a.href);
}
function importJSON() { document.getElementById('json-input').click(); }
document.getElementById('json-input').addEventListener('change', function (e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const parsed = JSON.parse(ev.target.result);
      if (!parsed || typeof parsed !== 'object' || !('experience' in parsed)) throw new Error('Not a resume JSON');
      snapshot();
      D = normalizeImported(parsed);
      render(currentTpl);
    } catch (err) {
      alert('Could not import: ' + err.message);
    }
  };
  reader.readAsText(file);
  this.value = '';
});
// tolerate a partial / older-shaped JSON
function normalizeImported(p) {
  const base = defaultResumeData();
  const d = Object.assign(base, p);
  d.contact = Object.assign(base.contact, p.contact || {});
  d.experience = (p.experience || []).map(x => ({ title: '', company: '', location: '', period: '', desc: '', bullets: [], ...x }));
  d.skills = Array.isArray(p.skills) ? p.skills : base.skills;
  d.skillGroups = p.skillGroups && typeof p.skillGroups === 'object' ? p.skillGroups : {};
  d.certificates = (p.certificates || []).map(x => (typeof x === 'string' ? { name: x, period: '', desc: '' } : { name: '', period: '', desc: '', ...x }));
  d.education = (p.education || []).map(x => ({ degree: '', institution: '', period: '', ...x }));
  d.languages = (p.languages || []).map(x => (typeof x === 'string' ? { name: x, level: '' } : { name: '', level: '', ...x }));
  d.interests = Array.isArray(p.interests) ? p.interests : [];
  return d;
}

// ============================================================
// PDF EXPORT
// ============================================================
function exportPDF() {
  extractEdits();
  const prevTitle = document.title;
  document.title = safeFilename() + '_Resume';
  window.print();
  setTimeout(() => { document.title = prevTitle; }, 500);
}

// ============================================================
// PERSISTENCE
// ============================================================
let saveTimer = null;
function setSaveState(state) {
  const el = document.getElementById('save-state');
  if (!el) return;
  el.className = state;
  el.textContent = state === 'saving' ? 'Saving…' : state === 'saved' ? 'Saved ✓' : '';
}
function saveToStorage() {
  setSaveState('saving');
  try {
    localStorage.setItem('hj_resume_data', JSON.stringify(D));
    localStorage.setItem('hj_resume_tpl', currentTpl);
  } catch (e) {}
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => setSaveState('saved'), 250);
}
function loadFromStorage() {
  try {
    const saved = localStorage.getItem('hj_resume_data');
    if (saved) D = normalizeImported(JSON.parse(saved));
    const tpl = localStorage.getItem('hj_resume_tpl');
    if (tpl && renderers[tpl]) currentTpl = tpl;
  } catch (e) {}
}
function resetData() {
  if (!confirm('Reset all edits and reload the seed resume?')) return;
  localStorage.removeItem('hj_resume_data');
  localStorage.removeItem('hj_resume_tpl');
  location.reload();
}

// ============================================================
// FIT TO WIDTH
// ============================================================
function fitScale() {
  const body = document.getElementById('app-body');
  const wrap = document.getElementById('resume-wrapper');
  const scaler = document.getElementById('resume-scaler');
  if (!body || !wrap || !scaler) return;
  const avail = body.clientWidth - 40;
  const fit = Math.max(0.4, Math.min(1, avail / 794));
  document.documentElement.style.setProperty('--fit', fit);
  scaler.style.width = (794 * fit) + 'px';
  requestAnimationFrame(() => { scaler.style.height = (wrap.offsetHeight * fit) + 'px'; });
}
window.addEventListener('resize', fitScale);
window.addEventListener('load', fitScale);

// ============================================================
// INIT
// ============================================================
(function init() {
  const btns = document.getElementById('template-btns');
  TEMPLATES.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'tpl-btn';
    btn.dataset.tpl = t.id;
    btn.textContent = t.label;
    btn.title = t.desc;
    btn.setAttribute('role', 'tab');
    btn.setAttribute('aria-selected', 'false');
    btn.onclick = () => { extractEdits(); render(t.id); };
    btns.appendChild(btn);
  });

  loadFromStorage();
  render(currentTpl);
  setSaveState('saved');

  const wrap = document.getElementById('resume-wrapper');

  // track focused editable (resolves any duplicate data-id)
  wrap.addEventListener('focusin', e => {
    if (e.target?.dataset?.id) {
      lastFocused.set(e.target.dataset.id, e.target);
      snapshot(); // capture pre-edit state
    }
  });

  // live-mirror sidebar name/title copies
  wrap.addEventListener('input', e => {
    const id = e.target?.dataset?.id;
    if (id === 'name' || id === 'title') {
      wrap.querySelectorAll(`[data-mirror="${id}"]`).forEach(m => { m.textContent = e.target.innerText; });
    }
  });

  // auto-save on blur
  wrap.addEventListener('focusout', () => { extractEdits(); saveToStorage(); });

  // paste as plain text
  wrap.addEventListener('paste', e => {
    if (!e.target?.isContentEditable) return;
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData('text/plain');
    const sel = window.getSelection();
    if (!sel || !sel.rangeCount) return;
    sel.deleteFromDocument();
    sel.getRangeAt(0).insertNode(document.createTextNode(text.replace(/\s*\n\s*/g, ' ')));
    sel.collapseToEnd();
  });

  // Enter blurs single-line fields
  wrap.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.shiftKey) return;
    const id = e.target?.dataset?.id;
    if (!id) return;
    if (id.includes('bullets') || id === 'summary') return; // allow newlines
    e.preventDefault();
    e.target.blur();
  });

  // global undo/redo
  document.addEventListener('keydown', e => {
    if (!(e.ctrlKey || e.metaKey)) return;
    if (e.key === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
    else if (e.key === 'y' || (e.key === 'z' && e.shiftKey)) { e.preventDefault(); redo(); }
  });

  fitScale();
})();
</script>
